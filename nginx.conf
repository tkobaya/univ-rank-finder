    location /webapp/univ-rank-finder/ {
        # The backend must run with ROOT_PATH=/webapp/univ-rank-finder so that
        # /openapi.json and the Swagger UI resolve under this prefix.

        satisfy any;
        # networks for event
        deny 131.112.213.0/24;
        deny 10.1.0.0/16;
        deny 10.0.0.0/16;
        # titanet
        allow 131.112.0.0/16;
        allow 172.16.0.0/12;
        allow 10.0.0.0/11;
        allow 10.255.0.0/16;
        # tmdu networks
        allow 202.242.160.0/19;
        allow 10.96.0.0/11;
        allow 10.254.0.0/16;
        deny all;

        proxy_pass http://192.168.208.84:8005/;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }