[project]
name = "univ-rank-finder"
version = "0.1.0"
description = "Collect QS / THE university rankings and map them onto RoR (Research Organization Registry) organizations"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.3.1",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy==2.0.51",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "cloudscraper==1.2.71",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
