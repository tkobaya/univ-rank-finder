[project]
name = "univ-rank-finder"
version = "0.1.0"
description = "Collect QS / THE university rankings and map them onto RoR (Research Organization Registry) organizations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "cloudscraper>=1.2.71",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
